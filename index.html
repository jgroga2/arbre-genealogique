<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre Généalogique | Famille Groga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        .node circle { fill: #2d3748; stroke: #4a5568; stroke-width: 2px; }
        .link { fill: none; stroke: #4a5568; stroke-width: 2px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px; text-align: center; width: 150px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .name { font-weight: bold; font-size: 13px; color: #f7fafc; margin-bottom: 4px; line-height: 1.2; }
        .details { font-size: 11px; color: #a0aec0; }
        .profession { font-size: 10px; color: #63b3ed; margin-top: 4px; }
        #tree-container { width: 100vw; height: 100vh; cursor: grab; }
        #tree-container:active { cursor: grabbing; }
    </style>
</head>
<body class="flex flex-col h-screen m-0 p-0">

    <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900 z-10 shadow-md absolute w-full top-0">
        <h1 class="text-xl font-bold tracking-wider">Généalogie GROGA (9 Générations)</h1>
        <div class="flex gap-2">
            <button onclick="zoomIn()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-sm">+</button>
            <button onclick="zoomOut()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700 text-sm">-</button>
            <button onclick="centerTree()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 rounded text-sm text-white font-medium">Centrer</button>
        </div>
    </header>

    <main id="tree-container"></main>

    <script>
        const treeData = {
            name: "Jean-Marc GROGA BADA",
            details: "Génération 1",
            profession: "Toi",
            children: [
                {
                    name: "Descendance",
                    details: "Tes enfants",
                    children: [
                        { name: "Kais GROGA", details: "Mère: Nicole INAGOHI" },
                        { name: "Ewen GROGA", details: "Mère: Nicole INAGOHI" },
                        { name: "Nathanyel GROGA", details: "Mère: Rita C. A. DICOH" }
                    ]
                },
                {
                    name: "Ascendance Paternelle",
                    details: "Famille GROGA BADA",
                    children: [
                        {
                            name: "Emmanuel Désiré GROGA BADA",
                            details: "1948 - 1998",
                            children: [
                                {
                                    name: "Dr Jules GROGA BADA",
                                    details: "1917 - Décédé",
                                    profession: "Médecin",
                                    children: [
                                        { name: "Groga DOASSÉ", details: "Soubré, CI" },
                                        { name: "Mahi AKRO", details: "Soubré, CI" }
                                    ]
                                },
                                {
                                    name: "Rolande DE SOUZA",
                                    details: "1923 - 2000",
                                    profession: "Sage-femme"
                                }
                            ]
                        }
                    ]
                },
                {
                    name: "Ascendance Maternelle",
                    details: "Familles POISSON & de THÉZILLAT",
                    children: [
                        {
                            name: "Anne M. C. POISSON",
                            details: "Née en 1954",
                            children: [
                                {
                                    name: "Jean (Aoua) POISSON",
                                    details: "1929 - Décédé",
                                    profession: "Ambassadeur, ENFOM",
                                    children: [
                                        { name: "Georges POISSON", details: "1898 - 1967" },
                                        { name: "Aoua BOUBACAR", details: "Niger" }
                                    ]
                                },
                                {
                                    name: "Claire de THÉZILLAT",
                                    details: "1930 - 2017",
                                    children: [
                                        {
                                            name: "Charles-Eugène-Roger de THÉZILLAT",
                                            details: "Zinder (1899)",
                                            profession: "Capitaine de cavalerie",
                                            children: [
                                                {
                                                    name: "Charles de THÉZILLAT",
                                                    details: "1824 - 1911",
                                                    profession: "Sous-préfet",
                                                    children: [
                                                        {
                                                            name: "Jean-François de THÉZILLAT",
                                                            details: "Né en 1795",
                                                            children: [
                                                                {
                                                                    name: "Toussaint de THÉZILLAT",
                                                                    details: "x É.G. Deloménie",
                                                                    children: [
                                                                        {
                                                                            name: "Jean-François de THÉZILLAT",
                                                                            details: "1732 - 1802",
                                                                            profession: "Génération 8 (Racine)"
                                                                        }
                                                                    ]
                                                                }
                                                            ]
                                                        }
                                                    ]
                                                }
                                            ]
                                        }
                                    ]
                                }
                            ]
                        }
                    ]
                }
            ]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const zoom = d3.zoom().scaleExtent([0.1, 3]).on("zoom", (event) => {
            svg.attr("transform", event.transform);
        });

        const canvas = d3.select("#tree-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(zoom);

        const svg = canvas.append("g");

        const root = d3.hierarchy(treeData);
        
        // Espace entre les noeuds pour accommoder les 9 générations
        const treeLayout = d3.tree().nodeSize([170, 220]);
        treeLayout(root);

        // Centrage initial adapté pour voir le point de départ
        d3.select("#tree-container svg").call(zoom.transform, d3.zoomIdentity.translate(width / 2, 120).scale(0.8));

        svg.selectAll(".link")
            .data(root.links())
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.linkVertical()
                .x(d => d.x)
                .y(d => d.y));

        const node = svg.selectAll(".node")
            .data(root.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x},${d.y})`);

        node.append("foreignObject")
            .attr("x", -75)
            .attr("y", -35)
            .attr("width", 150)
            .attr("height", 110)
            .html(d => `
                <div class="card">
                    <div class="name">${d.data.name}</div>
                    <div class="details">${d.data.details || ''}</div>
                    ${d.data.profession ? `<div class="profession">${d.data.profession}</div>` : ''}
                </div>
            `);

        function zoomIn() { canvas.transition().call(zoom.scaleBy, 1.2); }
        function zoomOut() { canvas.transition().call(zoom.scaleBy, 0.8); }
        function centerTree() { canvas.transition().call(zoom.transform, d3.zoomIdentity.translate(width / 2, 120).scale(0.8)); }
    </script>
</body>
</html>
